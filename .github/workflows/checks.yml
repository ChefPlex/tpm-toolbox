# Keeps this repository honest as it changes: every internal link must resolve, and the status
# synthesis tests pass. The tests replay recorded transcripts; no model or Slack is called.
# Actions are pinned to full commit SHAs, so a moved tag cannot change what runs here.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Internal links resolve
        run: python3 .github/check_links.py
      - name: Status synthesis tests
        run: python3 slack-canvas-status-synthesis/test_slack_status.py
